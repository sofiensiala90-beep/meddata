<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DASS • JS GATE</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config & Custom Styles -->
  <style type="text/tailwindcss">
    @layer base {
      :root {
        --color-primary-50: 240 253 250;
        --color-primary-100: 204 251 241;
        --color-primary-200: 153 246 228;
        --color-primary-300: 94 234 212;
        --color-primary-400: 45 212 191;
        --color-primary-500: 20 184 166;
        --color-primary-600: 13 148 136;
        --color-primary-700: 15 118 110;
        --color-primary-800: 17 94 89;
        --color-primary-900: 19 78 74;
      }
      /* Prevent elastic bounce on mobile but allow scrolling */
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
    }
    @layer components {
      .prose {
        color: theme('colors.slate.700');
        font-size: 0.9375rem;
      }
      .dark .prose {
        color: theme('colors.slate.300');
      }
      .prose h1, .prose h2, .prose h3, .prose h4 {
        color: theme('colors.teal.900');
        line-height: 1.2;
      }
      .dark .prose h1, .dark .prose h2, .dark .prose h3, .dark .prose h4 {
        color: theme('colors.white');
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.8);
      }

      /* Custom Mobile Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: theme('colors.slate.300');
        border-radius: 10px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: theme('colors.slate.600');
      }

      /* Animation for modals */
      @keyframes mobile-slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      .animate-mobile-slide-up {
        animation: mobile-slide-up 0.3s ease-out;
      }
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: 'rgb(var(--color-primary-50) / <alpha-value>)',
              100: 'rgb(var(--color-primary-100) / <alpha-value>)',
              200: 'rgb(var(--color-primary-200) / <alpha-value>)',
              300: 'rgb(var(--color-primary-300) / <alpha-value>)',
              400: 'rgb(var(--color-primary-400) / <alpha-value>)',
              500: 'rgb(var(--color-primary-500) / <alpha-value>)',
              600: 'rgb(var(--color-primary-600) / <alpha-value>)',
              700: 'rgb(var(--color-primary-700) / <alpha-value>)',
              800: 'rgb(var(--color-primary-800) / <alpha-value>)',
              900: 'rgb(var(--color-primary-900) / <alpha-value>)',
            },
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'glow': '0 0 15px rgba(20, 184, 166, 0.3)',
            'top': '0 -4px 15px -5px rgba(0,0,0,0.1)',
          }
        }
      }
    }
  </script>
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

  }
}
</script>
