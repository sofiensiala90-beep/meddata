<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedataAI</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config & Custom Styles -->
  <style type="text/tailwindcss">
    @layer base {
      :root {
        /* New Palette: Teal/Emerald (Medical Tech Feel) */
        /* Replaces the old Indigo palette */
        --color-primary-50: 240 253 250;
        --color-primary-100: 204 251 241;
        --color-primary-200: 153 246 228;
        --color-primary-300: 94 234 212;
        --color-primary-400: 45 212 191;
        --color-primary-500: 20 184 166;
        --color-primary-600: 13 148 136;
        --color-primary-700: 15 118 110;
        --color-primary-800: 17 94 89;
        --color-primary-900: 19 78 74;
      }
    }
    @layer components {
      .prose {
        color: theme('colors.slate.700');
      }
      .dark .prose {
        color: theme('colors.slate.300');
      }
      .prose h1, .prose h2, .prose h3, .prose h4 {
        color: theme('colors.teal.900');
      }
      .dark .prose h1, .dark .prose h2, .dark .prose h3, .dark .prose h4 {
        color: theme('colors.white');
      }
      .prose strong {
         color: theme('colors.teal.800');
      }
      .dark .prose strong {
         color: theme('colors.teal.200');
      }
       .prose blockquote {
        border-left-color: theme('colors.primary.500');
        color: theme('colors.slate.600');
        background-color: theme('colors.primary.50');
        padding: 1rem;
        border-radius: 0.5rem;
      }
      .dark .prose blockquote {
         border-left-color: theme('colors.primary.400');
         color: theme('colors.slate.400');
         background-color: theme('colors.slate.800');
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .blinking-cursor {
        display: inline-block;
        width: 8px;
        height: 1rem;
        background-color: theme('colors.slate.700');
        animation: blink 1s step-start infinite;
      }
      .dark .blinking-cursor {
        background-color: theme('colors.slate.300');
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.7);
      }
    }
  </style>

  <script>
    // Tailwind Custom Configuration
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
          colors: {
            primary: {
              50: 'rgb(var(--color-primary-50) / <alpha-value>)',
              100: 'rgb(var(--color-primary-100) / <alpha-value>)',
              200: 'rgb(var(--color-primary-200) / <alpha-value>)',
              300: 'rgb(var(--color-primary-300) / <alpha-value>)',
              400: 'rgb(var(--color-primary-400) / <alpha-value>)',
              500: 'rgb(var(--color-primary-500) / <alpha-value>)',
              600: 'rgb(var(--color-primary-600) / <alpha-value>)',
              700: 'rgb(var(--color-primary-700) / <alpha-value>)',
              800: 'rgb(var(--color-primary-800) / <alpha-value>)',
              900: 'rgb(var(--color-primary-900) / <alpha-value>)',
            },
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'glow': '0 0 15px rgba(20, 184, 166, 0.3)',
          }
        }
      }
    }
  </script>
  <script>
    // Polyfill simple pour éviter le crash 'process is not defined' dans le navigateur
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

}
